[project]
name = "governed-ai-gateway"
version = "0.7.0"
description = "Governed AI Gateway: an OpenAI-compatible LLM gateway with policy-as-code, budgets, fallback and circuit breakers, spend-anomaly detection, request traces and a product console"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Corey Mathie" }]
keywords = ["llm", "gateway", "litellm", "openai", "anthropic", "gemini", "ollama", "finops"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
