# MCP tool gateway config for running with simulated providers (ROUTER_MOCK_PROVIDERS=true, as docker compose
# does). Same allow-lists and limits as config/mcp.example.yaml, but the servers are the gateway's own
# simulated MCP servers at /mock/mcp/{server} (router/mock_provider.py), so tool calls work with no real
# MCP servers and no credentials. The port must match the gateway's (4000 in docker-compose.yml).
version: 1

servers:
  tickets:
    url: http://127.0.0.1:4000/mock/mcp/tickets
    timeout_s: 10
  files:
    url: http://127.0.0.1:4000/mock/mcp/files
    timeout_s: 5

defaults:
  per_minute: 60
  team_per_minute: 0
  max_identical_per_minute: 5
  per_day: 0
  cost_usd: 0.0
  daily_usd: 0.0
  redact_args: true
  forward_redacted: false

teams:
  support:
    - { server: tickets, tool: "search_*" }
    - { server: tickets, tool: get_ticket }
    - { server: tickets, tool: close_ticket, per_minute: 5, per_day: 200 }
  data:
    - { server: files, tool: read_file, per_minute: 30, cost_usd: 0.001, daily_usd: 2.0 }
