name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/generate_sample_company.py --check
      - run: python scripts/sample_requests.py --check
      - run: python scripts/build_eval_cases.py --check
      - run: python scripts/build_semcache_pairs.py --check
      - run: python scripts/build_semcache_heldout.py --check
      - run: python scripts/calibrate_semcache.py

  console-smoke:
    # Headless Chromium over the console (demo/). Live mode needs no network beyond installs; demo mode loads
    # Pyodide from jsDelivr, so it is allowed to fail without failing the build.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Live mode (gateway + simulated providers)
        run: python scripts/demo_smoke.py --live
      - name: Demo mode (Pyodide from the CDN)
        continue-on-error: true
        run: python scripts/demo_smoke.py

  docker:
    # Builds the image from the Dockerfile (no push) and runs one command inside it, so a base-image bump
    # (Dependabot) is only green if the image still builds and the gateway still imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag governed-ai-gateway:ci .
      - name: Smoke command inside the image
        run: docker run --rm governed-ai-gateway:ci python -c "import router.main; print(router.main.app.title)"
