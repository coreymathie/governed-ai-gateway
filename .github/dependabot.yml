# Weekly dependency updates, grouped so routine bumps arrive as one pull request.
# Security fixes arrive as their own pull requests as soon as they're published.
# A 7-day cooldown skips brand-new releases; CI runs on every Dependabot pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: &weekly
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule: *weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule: *weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
