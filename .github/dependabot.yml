# Security fixes for Python packages arrive as soon as they're published.
# Routine Python updates are off: requirements set minimum versions, not pins, so
# installs already resolve to current releases and raising a floor adds little.
# GitHub Actions arrive as one grouped pull request a week. Majors are skipped.
# A 7-day cooldown skips brand-new releases; CI runs on every Dependabot pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
