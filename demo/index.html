<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Governed AI Gateway Console</title>
<meta name="description" content="Governed AI Gateway console: spend, traces, policies, budgets and keys for an OpenAI-compatible LLM gateway. Runs the gateway's real Python modules in your browser against simulated providers, or connects to a running gateway." />
<meta name="theme-color" content="#0e0a1d" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Console navigation">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#8b5cf6"/><path d="M9 11h14M9 16h9M9 21h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div>
        <div class="brand-name">Governed AI Gateway</div>
        <div class="brand-sub">Console</div>
      </div>
    </div>
    <button class="menu-btn ghost" id="menuBtn" aria-expanded="false" aria-controls="nav" aria-label="Open navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">
      <a href="https://github.com/coreymathie/governed-ai-gateway" id="repoLink">View the repo</a>
      <span id="footMode">Starting…</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="title" id="pageTitle">Overview</span>
      <span class="spacer"></span>
      <button class="ghost sm" id="tourBtn" type="button">Guided tour</button>
      <span class="mode-badge" id="modeBadge" role="status"><span class="dot"></span><span id="modeText">Starting…</span></span>
    </header>
    <main class="content" id="view" tabindex="-1">
      <div class="loading" id="bootPanel"><span class="spin" aria-hidden="true"></span><span id="bootText">Starting the console…</span></div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"></aside>
<div class="tour" id="tour" aria-live="polite"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:16px">The console needs JavaScript. The gateway's API works without it: see the README.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
